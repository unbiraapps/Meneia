# Compila la app de Android (APK) en GitHub, sin instalar nada en tu compu.
# Se corre sola en cada cambio, o a mano desde la pestaña "Actions" > "App de Android" > "Run workflow".
name: App de Android
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npx cap sync android
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Compilar APK
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleDebug && mv app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/meneia.apk
      - uses: actions/upload-artifact@v4
        with:
          name: meneia-apk
          path: android/app/build/outputs/apk/debug/meneia.apk
