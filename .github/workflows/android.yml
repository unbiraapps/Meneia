# Compila la app de Android en GitHub, sin instalar nada en tu compu.
# Si están los secretos de firma, arma la versión release firmada; si no, la versión de prueba.
# Se corre sola en cada cambio, o a mano desde Actions > "App de Android" > "Run workflow".
name: App de Android
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
      HAS_DRIVE: ${{ secrets.RCLONE_CONF != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          VITE_ADMOB_BANNER_ID: ${{ secrets.ADMOB_BANNER_ID }}
          VITE_ADMOB_INTERSTITIAL_ID: ${{ secrets.ADMOB_INTERSTITIAL_ID }}
          VITE_ADMOB_REWARDED_ID: ${{ secrets.ADMOB_REWARDED_ID }}
      - run: npx cap sync android
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Preparar la firma
        if: env.HAS_KEYSTORE == 'true'
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/meneia.jks"
          echo "MENEIA_KEYSTORE=$RUNNER_TEMP/meneia.jks" >> "$GITHUB_ENV"
      - name: Compilar APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          MENEIA_VERSION_CODE: ${{ github.run_number }}
          ADMOB_APP_ID: ${{ secrets.ADMOB_APP_ID }}
        run: |
          chmod +x gradlew
          if [ "$HAS_KEYSTORE" = "true" ]; then
            ./gradlew assembleRelease bundleRelease
            cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/meneia.apk"
            cp app/build/outputs/bundle/release/app-release.aab "$RUNNER_TEMP/meneia.aab"
          else
            ./gradlew assembleDebug
            cp app/build/outputs/apk/debug/app-debug.apk "$RUNNER_TEMP/meneia.apk"
          fi
      - name: Verificar la firma
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          OUT=$("$APKSIGNER" verify --print-certs "$RUNNER_TEMP/meneia.apk")
          echo "$OUT" | grep -E "certificate (DN|SHA-256 digest)" | head -2
      - uses: actions/upload-artifact@v4
        with:
          name: meneia
          path: ${{ runner.temp }}/meneia.*
      - name: Publicar para descargar desde el celular
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete ultima-version --yes --cleanup-tag || true
          FILES="$RUNNER_TEMP/meneia.apk"
          [ -f "$RUNNER_TEMP/meneia.aab" ] && FILES="$FILES $RUNNER_TEMP/meneia.aab"
          gh release create ultima-version $FILES \
            --title "Meneia (última versión)" \
            --notes "Abrí este link desde el celular para instalar Meneia: https://github.com/${{ github.repository }}/releases/download/ultima-version/meneia.apk" \
            --target ${{ github.sha }} --latest
      - name: Subir al Drive de unbira
        if: env.HAS_DRIVE == 'true'
        env:
          RCLONE_CONF: ${{ secrets.RCLONE_CONF }}
          DRIVE_FOLDER: ${{ vars.DRIVE_FOLDER || 'Meneia/APK' }}
        run: |
          curl -fsSL https://rclone.org/install.sh | sudo bash > /dev/null
          mkdir -p ~/.config/rclone
          printf '%s' "$RCLONE_CONF" > ~/.config/rclone/rclone.conf
          STAMP=$(TZ=America/Argentina/Buenos_Aires date +%Y-%m-%d_%H%M)
          rclone copyto "$RUNNER_TEMP/meneia.apk" "unbira:$DRIVE_FOLDER/meneia.apk"
          rclone copyto "$RUNNER_TEMP/meneia.apk" "unbira:$DRIVE_FOLDER/anteriores/meneia_$STAMP.apk"
          echo "Subida a Drive: $DRIVE_FOLDER/meneia.apk"
