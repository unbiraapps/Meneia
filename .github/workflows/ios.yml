# App de iPhone, compilada en una Mac de GitHub (gratis porque el repo es público). No hace falta Mac propia.
# En cada cambio: compila para el simulador sin firma, la abre y saca capturas (artefacto "iphone-simulador").
# A mano (Actions > "App de iPhone" > Run workflow, con "subir" marcado): firma y sube a TestFlight.
# Nunca envía a revisión de Apple: eso se hace a mano en App Store Connect.
name: App de iPhone
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      subir:
        description: 'Firmar y subir a TestFlight (no envía a revisión)'
        type: boolean
        default: false
      anuncios_reales:
        description: 'Usar los IDs reales de AdMob (solo para la versión que va a la tienda)'
        type: boolean
        default: false
permissions:
  contents: write
concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true
jobs:
  simulador:
    runs-on: macos-26
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Armar la web (anuncios de prueba)
        run: npm run build
        env:
          VITE_ADS_TEST: '1'
      - run: npx cap sync ios
      - run: xcodebuild -version
      - name: Compilar para el simulador, sin firma
        run: |
          set -euo pipefail
          xcodebuild build -project ios/App/App.xcodeproj -scheme App -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' -configuration Debug -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO | tail -n 40
      - name: Abrir en el simulador y sacar capturas
        run: bash scripts/ios-smoke.sh
      - name: Guardar las capturas en la rama ios-capturas (para revisarlas sin bajar artefactos)
        if: always() && github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          ls evidence/*.png >/dev/null 2>&1 || exit 0
          SHA=${GITHUB_SHA::7}
          git config user.name "github-actions"; git config user.email "github-actions@users.noreply.github.com"
          if git fetch -q origin ios-capturas 2>/dev/null; then git worktree add -q ../caps origin/ios-capturas; else git worktree add -q --detach ../caps; (cd ../caps && git checkout -q --orphan ios-capturas && git rm -rq . || true); fi
          (cd ../caps && git rm -rq --ignore-unmatch . && git clean -fdq) || true
          mkdir -p ../caps/ultima && cp evidence/*.png evidence/resultado.txt ../caps/ultima/ 2>/dev/null || true
          echo "$SHA" > ../caps/ultima/commit.txt
          cd ../caps && git add -A ultima && (git commit -qm "Capturas de iPhone de $SHA" && git push -q origin HEAD:ios-capturas) || echo "Sin cambios"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: iphone-simulador
          path: evidence/
          retention-days: 14

  testflight:
    if: github.event_name == 'workflow_dispatch' && inputs.subir
    needs: simulador
    runs-on: macos-26
    timeout-minutes: 60
    env:
      VITE_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Armar la web
        run: npm run build
        env:
          VITE_ADS_TEST: ${{ inputs.anuncios_reales && '0' || '1' }}
          VITE_ADMOB_IOS_BANNER_ID: ${{ secrets.ADMOB_IOS_BANNER_ID }}
          VITE_ADMOB_IOS_INTERSTITIAL_ID: ${{ secrets.ADMOB_IOS_INTERSTITIAL_ID }}
          VITE_ADMOB_IOS_REWARDED_ID: ${{ secrets.ADMOB_IOS_REWARDED_ID }}
      - run: npx cap sync ios
      - name: Clave de la API de App Store Connect
        env:
          ASC_KEY: ${{ secrets.ASC_API_KEY_P8 }}
        run: |
          set -euo pipefail
          test -n "$ASC_KEY" || { echo "Falta el secreto ASC_API_KEY_P8 (ver docs/PARA-CODEX.md)"; exit 1; }
          mkdir -p "$RUNNER_TEMP/asc"
          printf '%s' "$ASC_KEY" > "$RUNNER_TEMP/asc/key.p8"
      - name: Archivar firmado (firma automática con la clave de la API)
        env:
          KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ISSUER: ${{ secrets.ASC_API_ISSUER_ID }}
          TEAM: ${{ secrets.APPLE_TEAM_ID }}
          GAD_ID: ${{ inputs.anuncios_reales && secrets.ADMOB_IOS_APP_ID || 'ca-app-pub-3940256099942544~1458002511' }}
        run: |
          set -euo pipefail
          xcodebuild archive -project ios/App/App.xcodeproj -scheme App -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/Meneia.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/asc/key.p8" -authenticationKeyID "$KEY_ID" -authenticationKeyIssuerID "$ISSUER" \
            DEVELOPMENT_TEAM="$TEAM" CODE_SIGN_STYLE=Automatic \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" GAD_APPLICATION_ID="$GAD_ID" | tail -n 40
      - name: Subir a App Store Connect (TestFlight, sin enviar a revisión)
        env:
          KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ISSUER: ${{ secrets.ASC_API_ISSUER_ID }}
          TEAM: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          sed "s/__TEAM__/$TEAM/" ios/ExportOptions.plist > "$RUNNER_TEMP/ExportOptions.plist"
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/Meneia.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/asc/key.p8" -authenticationKeyID "$KEY_ID" -authenticationKeyIssuerID "$ISSUER" | tail -n 40
          echo "Subida a TestFlight: Meneia compilación ${{ github.run_number }}"
      - if: always()
        run: rm -rf "$RUNNER_TEMP/asc"
