<!doctype html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cuenta confirmada · Meneia</title>
<meta name="description" content="Tu cuenta de Meneia está confirmada.">
<meta name="theme-color" content="#17131F">
<link rel="icon" href="../favicon.svg" type="image/svg+xml">
<style>
:root{--bg:#17131F;--surface:#221C30;--line:#3A3152;--fg:#EFEAFA;--muted:#AEA4CA;--plum:#B5A4E6;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.65 "Figtree",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  padding:32px max(16px,env(safe-area-inset-right)) 56px max(16px,env(safe-area-inset-left))}
main{max-width:680px;margin:0 auto;display:grid;gap:22px}
h1{font:700 34px/1.1 "Trebuchet MS",system-ui,sans-serif;margin:0}
h2{font:700 20px "Trebuchet MS",system-ui,sans-serif;margin:0 0 6px}
p,li{max-width:65ch}
p{margin:0}
ol{margin:6px 0 0;padding-left:22px}
a{color:var(--plum)}
.muted{color:var(--muted)}
section{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:18px 20px}
</style>
</head>
<body>
<main>
  <header>
    <p class="muted">Meneia · de Unbira</p>
    <h1>Cuenta confirmada</h1>
  </header>
  <section>
    <p>Listo, tu email quedó confirmado. Volvé a Meneia, andá a <b>Perfil</b> › <b>Copia de seguridad</b> y entrá con tu email y tu contraseña.</p>
  </section>
  <p class="muted">Tus datos de salud se cifran en tu celular antes de subirse. Más detalles en la <a href="../privacidad/">política de privacidad</a>.</p>
</main>
</body>
</html>
