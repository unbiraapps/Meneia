<!doctype html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Contraseña nueva · Meneia</title>
<meta name="theme-color" content="#17131F">
<link rel="icon" href="../favicon.svg" type="image/svg+xml">
<style>
:root{--bg:#17131F;--surface:#221C30;--line:#3A3152;--fg:#EFEAFA;--muted:#AEA4CA;--plum:#B5A4E6;--bad:#F2A9C2;--ok:#9FD8B7;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:32px 16px 56px}
main{max-width:420px;margin:0 auto;display:grid;gap:16px}
h1{font:700 30px/1.15 "Trebuchet MS",system-ui,sans-serif;margin:0}
p{margin:0}
.muted{color:var(--muted)}
label{display:grid;gap:6px;font-size:14px;font-weight:600;color:var(--muted)}
input{background:var(--bg);border:1.5px solid var(--line);border-radius:12px;padding:12px;color:var(--fg);font:16px system-ui,sans-serif;min-height:48px}
input:focus{outline:2px solid var(--plum);outline-offset:1px}
button{min-height:52px;border:none;border-radius:16px;background:var(--plum);color:#17131F;font:700 16px system-ui,sans-serif;cursor:pointer}
button:disabled{opacity:.5;cursor:default}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:18px;display:grid;gap:14px}
.msg{font-size:14px}.msg.bad{color:var(--bad)}.msg.ok{color:var(--ok)}
</style>
</head>
<body>
<main>
  <p class="muted">Meneia</p>
  <h1>Elegí una contraseña nueva</h1>
  <p class="muted" style="font-size:14px">Es la contraseña para entrar a tu cuenta. Tu <b>contraseña de copia</b> no cambia: la seguís necesitando para abrir tu copia.</p>
  <form class="card" id="f">
    <label>Contraseña nueva<input type="password" id="p1" autocomplete="new-password" minlength="8" required></label>
    <label>Repetila<input type="password" id="p2" autocomplete="new-password" minlength="8" required></label>
    <p class="msg" id="m" role="status"></p>
    <button type="submit" id="b">Guardar</button>
  </form>
</main>
<script type="module" src="../src/nueva-clave.ts"></script>
</body>
</html>
